[package]
name = "zzy"
version = "0.1.2"
edition = "2021"
description = "GPUI based terminal emulator"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", package = "gpui-kit", rev = "6f2a223b2ac71af0e9f654a913ce33227a4ea258" }
alacritty_terminal = "0.25.1"
parking_lot = "0.12.5"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
shell-words = "1.1.1"
libc = "0.2.191"
rust-i18n = "4.2"

# Workaround for KWin (6.8) offsetting the ext-background-effect blur region by
# the window geometry, although the protocol defines it in surface-local
# coordinates: with client-side decorations the blur ended up shifted, leaving
# unblurred bands on the left/top edges. Only src/linux/wayland/window.rs
# differs from gpui-pre-linux 0.3.14. On spec-compliant compositors this would
# shift the blur the other way; drop it once KWin is fixed.
[patch.crates-io]
gpui-pre-linux = { path = "patches/gpui-pre-linux" }

[profile.release]
# Smaller downloads: release binaries carry no debug symbols.
strip = true
